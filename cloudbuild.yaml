steps:
  # ── CI Quality Gates ──────────────────────────────────────────────────────────

  # Install backend dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'backend'
    id: 'backend-install'

  # Lint backend
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'lint']
    dir: 'backend'
    waitFor: ['backend-install']
    id: 'backend-lint'

  # Test backend (with coverage)
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'test:coverage']
    dir: 'backend'
    waitFor: ['backend-lint']
    id: 'backend-test'

  # Install frontend dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'frontend'
    id: 'frontend-install'

  # Lint frontend
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'lint']
    dir: 'frontend'
    waitFor: ['frontend-install']
    id: 'frontend-lint'

  # Test frontend
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'test']
    dir: 'frontend'
    waitFor: ['frontend-lint']
    id: 'frontend-test'

  # ── Build & Deploy ──────────────────────────────────────────────────────────

  # Build the container image (only after all tests pass)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/prompt-wars-495105/civicguide', '.']
    waitFor: ['backend-test', 'frontend-test']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/prompt-wars-495105/civicguide']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'civicguide'
      - '--image'
      - 'gcr.io/prompt-wars-495105/civicguide'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--platform'
      - 'managed'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'

images:
  - 'gcr.io/prompt-wars-495105/civicguide'
